name: Release

# Build every platform in parallel, then publish ONE release containing all of it.
#
#  - Tag push (v*)                    : build all three, verify the expected files exist, publish.
#  - Pull request touching this file  : build all three and keep the files as workflow artifacts
#    only (electron-builder skips code signing on pull requests, so signing is not exercised).
#  - Manual run (workflow_dispatch)   : same as a tag build but never publishes.
#
# Nothing is published unless every platform built. electron-builder is told `--publish never`
# so it cannot create its own (draft) release; the single publish job below owns that.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  # Manual dry run from the Actions tab (or `gh workflow run release.yml --ref main`): builds and signs
  # exactly like a tag build, keeps the output as artifacts, publishes nothing. Unlike a pull request build,
  # electron-builder does not skip code signing here, so this is the real test of the signing setup.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    # Pull requests from forks never get the signing secrets, so they do not build.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false # one platform failing must not hide whether the others work
      matrix:
        include:
          # Runners are pinned (not `-latest`) so a runner image migration cannot change the build.
          - name: Windows
            os: windows-2022
            script: electron:build:win
            # The Windows installer is signed with the self-signed certificate in CSC_LINK.
            sign: true
          - name: Linux
            os: ubuntu-24.04
            script: electron:build:linux
            sign: false
          - name: macOS
            os: macos-15
            script: electron:build:mac
            # No Apple Developer ID is available, and a non-Apple certificate in the keychain fails
            # to unlock on recent runners. With no certificate electron-builder falls back to an
            # ad-hoc signature, which Apple Silicon requires in order to launch the app at all.
            sign: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `--publish never` is appended to the electron-builder command in the npm script.
      - name: Build Electron app (signed)
        if: matrix.sign
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # The signing variables must be absent, not empty: electron-builder treats an empty CSC_LINK as a
      # path ("not a file") instead of "no certificate".
      - name: Build Electron app (no certificate)
        if: ${{ !matrix.sign }}
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/latest*.yml
            release/*.blockmap

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the only job that can create a release
    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true

      - name: Verify every platform produced its installer
        run: |
          set -eu
          ls -la dist-release
          missing=0
          for pattern in '*.exe' '*.dmg' '*.AppImage' 'latest.yml' 'latest-linux.yml'; do
            if ! ls dist-release/$pattern >/dev/null 2>&1; then
              echo "::error::No file matching $pattern in the build output"
              missing=1
            fi
          done
          exit $missing

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## AI Model DB ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

            ### Downloads
            - **Windows**: `AI-Model-DB-Setup.exe` (signed with a self-signed certificate, so SmartScreen will warn on first run)
            - **macOS** (Apple Silicon): `.dmg` (ad-hoc signed, not notarized: right-click the app and choose Open the first time)
            - **Linux**: `.AppImage` or `.deb`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
